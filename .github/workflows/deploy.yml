name: Build Push Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kotulskim
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/kotulskim/swarm-demo:latest .

      - name: Push image
        run: docker push ghcr.io/kotulskim/swarm-demo:latest

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Swarm
        run: |
          ssh ${{ secrets.USER }}@${{ secrets.HOST }} "
          docker service update \
          --image ghcr.io/kotulskim/swarm-demo:latest \
          --with-registry-auth \
          demo_web
          "

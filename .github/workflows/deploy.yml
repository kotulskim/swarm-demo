name: Build Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kotulskim
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build -t ghcr.io/kotulskim/swarm-demo:${{ env.TAG }} .
          docker tag ghcr.io/kotulskim/swarm-demo:${{ env.TAG }} ghcr.io/kotulskim/swarm-demo:latest

      - name: Push image
        run: |
          docker push ghcr.io/kotulskim/swarm-demo:${{ env.TAG }}
          docker push ghcr.io/kotulskim/swarm-demo:latest
